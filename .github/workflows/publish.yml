name: Publish
# Tags are pushed here by the mirror script in the private repo that authors
# this package. Publishing from a public repository is what lets npm generate
# a provenance attestation.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./plugin/package.json').version")
          [ "$tag" = "$pkg" ] || { echo "tag v$tag != package $pkg" >&2; exit 1; }
      - run: npm publish
        working-directory: plugin
