name: Publish
# Tags are pushed here by the mirror script in the private repo that authors
# this package. Publishing from a public repository is what lets npm generate
# a provenance attestation.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is for creating the release; id-token for OIDC publish.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./plugin/package.json').version")
          [ "$tag" = "$pkg" ] || { echo "tag v$tag != package $pkg" >&2; exit 1; }
      - run: npm publish
        working-directory: plugin

      # The tag's own annotation becomes the release notes, so whatever was
      # written at release time carries through without a second place to keep
      # it. Auto-generated notes would be useless here: this repository has one
      # synthetic commit per release.
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git fetch --force --tags --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          {
            [ -n "$notes" ] && printf '%s\n\n' "$notes"
            printf '```bash\nnpm install jusho-jp@%s\n```\n\n' "$version"
            printf '[npmjs.com/package/jusho-jp/v/%s]' "$version"
            printf '(https://www.npmjs.com/package/jusho-jp/v/%s)\n' "$version"
            printf 'Published from this commit with a provenance attestation.\n'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
